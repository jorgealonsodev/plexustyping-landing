# Keeps the download data current (odd/tasks/site-pages.md S16): every hour, and on demand
# (Actions → refresh-release → Run workflow), read the latest release of jorgealonsodev/plexustyping and,
# only when it changed, rewrite src/data/release-snapshot.json, gate it with a build and the tests, and
# commit that one file to main. Portainer redeploys from the push to main (README "Deploy").
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows. That is fine here: no workflow needs to
# run after this one, and Portainer reacts to the new commit on main itself (GitOps polling or webhook).
name: refresh-release

on:
  schedule:
    - cron: "17 * * * *" # hourly, at minute 17 (not :00, when GitHub's scheduler is busiest)
  workflow_dispatch:

# Least privilege: the only write is the snapshot commit pushed to main.
permissions:
  contents: write

# Never two runs at once (a slow run must not race the next hour's push); a queued run waits.
concurrency:
  group: refresh-release
  cancel-in-progress: false

jobs:
  refresh:
    # main only: a manual run from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: the build dates sitemap <lastmod> from git (src/lib/lastmod.ts).
          fetch-depth: 0

      # pnpm version from package.json "packageManager" (pnpm@10.34.5), as the Dockerfile's corepack.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5 # same as the Dockerfile (node:22.23.5-alpine3.24)
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Refresh the release snapshot
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm refresh:release
          if git diff --quiet -- src/data/release-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate - build and test with the new snapshot
        if: steps.refresh.outputs.changed == 'true'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          # Build from the committed snapshot, exactly as the next deploy will read it.
          RELEASE_SOURCE: snapshot
        run: |
          pnpm build
          pnpm test

      - name: Commit and push the snapshot to main
        if: steps.refresh.outputs.changed == 'true'
        run: |
          tag="$(node -p 'require("./src/data/release-snapshot.json").tag_name')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/release-snapshot.json
          git commit -m "chore(release): update the download data to ${tag}"
          git push origin HEAD:main
