<!-- App icon: logo.svg cropped to the key, so the icon fills its whole square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 224 224" role="img" aria-labelledby="plexustyping-logo-title">
  <title id="plexustyping-logo-title">PlexusTyping</title>
  <defs>
    <linearGradient id="k-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4cdff"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient>
    <linearGradient id="k-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f6fa8"/><stop offset="1" stop-color="#2a3b66"/></linearGradient>
    <radialGradient id="k-dish" cx="0.5" cy="0.35" r="0.75"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="16" y="30" width="224" height="210" rx="50" fill="url(#k-side)"/>
  <rect x="34" y="16" width="188" height="184" rx="38" fill="url(#k-top)"/>
  <rect x="34" y="16" width="188" height="184" rx="38" fill="url(#k-dish)"/>
  <rect x="35" y="17" width="186" height="182" rx="37" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="128" y="138" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#1e1e2e">P</text>
  <!-- pink homing bump, like F and J -->
  <rect x="100" y="160" width="56" height="10" rx="5" fill="#f5c2e7" stroke="#1e1e2e" stroke-width="3"/>
</svg>
