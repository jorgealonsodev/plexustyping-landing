# PlexusTyping website: builds the static site and serves it with unprivileged nginx.
# Deployable as a Portainer Stack from this Git repository. TLS is terminated by the reverse
# proxy in front (Nginx Proxy Manager); this stack only publishes one plain-HTTP host port.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://example.com}
    image: plexustyping-landing:latest
    # Always rebuild on "up": Portainer redeploys a Git stack with "docker compose up -d",
    # which would otherwise reuse the existing image and ignore new commits.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-14834}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
