# Main nginx configuration for the static site image (nginx-unprivileged, uid 101).
# Read-only root filesystem: every path nginx writes to (pid, temp files) lives under /tmp,
# which the compose stack mounts as tmpfs. Logs go to stdout/stderr (symlinks in the base image).

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    # Types the stock mime.types lacks.
    types {
        application/manifest+json  webmanifest;
        text/javascript            mjs;
    }
    default_type  application/octet-stream;

    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript text/javascript
                  application/json application/manifest+json image/svg+xml;

    # Requests arrive through Nginx Proxy Manager. The log records the client address the proxy
    # forwards, but nothing trusts or acts on Host or X-Forwarded-* headers.
    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    server_tokens off;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # Precompressed .gz files are written at build time (gzip -9); on-the-fly gzip covers the rest.
    # Brotli needs a third-party module this image does not ship.
    gzip_static     on;
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      text/css text/plain text/xml application/javascript text/javascript
                    application/json application/manifest+json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
