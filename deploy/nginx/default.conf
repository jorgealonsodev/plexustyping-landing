# Site server for the Astro static build (build.format "file", trailingSlash "never").
# Replaces the base image's default.conf, so the image's IPv6 entrypoint script leaves it alone.

server {
    # IPv4 only: Docker publishes the port through its own proxy, and an IPv6 listen fails to
    # start on hosts with IPv6 disabled.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Redirects carry a relative Location, never this container's host or internal port 8080.
    absolute_redirect  off;
    port_in_redirect   off;
    autoindex          off;
    index              index.html;

    error_page 404 /404.html;

    # HTML and anything else without a content hash: always revalidate.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # Clean URLs: /en -> en.html, /sim-preview/s5 -> sim-preview/s5.html.
        try_files $uri $uri.html =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    # URLs never end in a slash: /en/ -> /en (one hop; the target has no slash, so no loop).
    location ~ ^(?<noslash>.+)/$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 301 $noslash$is_args$args;
    }

    # Astro's hashed assets (scripts, styles, fonts): cache forever.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The built 404 page, served with a real 404 status for unknown paths.
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
