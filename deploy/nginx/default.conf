# Site server for the Astro static build (build.format "file", trailingSlash "never").
# Replaces the base image's default.conf, so the image's IPv6 entrypoint script leaves it alone.

server {
    # IPv4 only: Docker publishes the port through its own proxy, and an IPv6 listen fails to
    # start on hosts with IPv6 disabled.
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Redirects carry a relative Location, never this container's host or internal port 8080.
    absolute_redirect  off;
    port_in_redirect   off;
    autoindex          off;
    index              index.html;

    error_page 404 /404.html;

    # HTML and anything else without a content hash: always revalidate.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        # Clean URLs: /en -> en.html, /sim-preview/s5 -> sim-preview/s5.html.
        try_files $uri $uri.html =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    # URLs never end in a slash: /en/ -> /en (one hop; the target has no slash, so no loop).
    location ~ ^(?<noslash>.+)/$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 301 $noslash$is_args$args;
    }

    # One URL per page (odd/tasks/seo-gaps.md S9): the file names behind the clean URLs redirect to
    # them, and /404 answers with a real 404 status instead of serving 404.html as a 200.
    # Regex locations match in order: /index.html must reach / in one hop.
    location ~ ^/index(\.html)?$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 301 /$is_args$args;
    }

    # The capture starts with one slash and a non-slash, so the Location can never be protocol-relative.
    location ~ ^(?<base>/[^/].*)\.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        return 301 $base$is_args$args;
    }

    location = /404 {
        return 404;
    }

    # Pagefind's index, fragment and meta files carry a content hash in their names: cache forever.
    # pagefind.js and pagefind-entry.json keep their names across builds and stay under location /.
    location ~ ^/pagefind/.+\.(pf_fragment|pf_index|pf_meta|pf_filter)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Astro's hashed assets (scripts, styles, fonts): cache forever.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Open Graph cards: social crawlers and chat apps fetch them from other origins, so they are
    # served with Cross-Origin-Resource-Policy: cross-origin instead of the site-wide same-origin
    # (docs/seo-2026.md §B8). Plain images: no CSP or frame headers needed.
    location ~ ^/og/.+\.png$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The built 404 page, served with a real 404 status for unknown paths.
    location = /404.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
